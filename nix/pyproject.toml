# Generated by odoo-nix for a repository of addons (addons mode): the uv
# project its development environment is built from. `odoo project relock`
# (or `nix run .#relock` outside the shell) rewrites the managed blocks from
# the addons in the repository and the flake inputs linked under .odoo-nix/;
# commit this file and uv.lock beside it. The paths are relative to this
# directory.
[project]
name = "timesheet-addons"
version = "0"
requires-python = ">=3.11"

# Install roots (lib/oca_sources.py --roots=local): OCB `odoo`, `packaging`,
# and each installable addon of this repository: as odoo-addon-<name> when it
# is packaged, otherwise its external_dependencies.python and the packaged
# modules its depends reach.
dependencies = [
    # >>> odoo-nix: install set (managed from modules.txt) >>>
    "odoo",
    "packaging",
    "odoo-addon-hr_timesheet_time_control_systray",
    # <<< odoo-nix: install set <<<
]

[dependency-groups]
# Development and test tooling, in the dev environment only. Hand-edited: the
# relock leaves this block alone.
dev = [
    "debugpy",
    # Odoo's --dev=reload watcher needs a filesystem watcher it does not declare.
    "watchdog",
    # Odoo's test runner imports freezegun, and browser tours need
    # websocket-client (a missing one skips every tour silently).
    "freezegun",
    "websocket-client",
]

[tool.uv]
# A virtual project: the addons load from addons_path.
package = false
# gevent < 23.7 imports pkg_resources, which setuptools >= 81 dropped.
constraint-dependencies = ["setuptools<81"]

# OCB, and the packaged modules of the external sources (non-editable: they
# are store paths). Managed by lib/oca_sources.py; do not edit by hand.
